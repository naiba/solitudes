{{define "admin/error"}}
{{if not .Account}}
<!doctype html><html lang="{{.Tr.Locale}}"><head><title>{{.Data.title}}</title>{{template "admin/css"}}</head>
<body><main class="login-wrapper" id="main-content"><div class="login-card wf-card-static" style="padding:2.5rem">
    <h1>{{.Data.title}}</h1><p>{{.Data.msg}}</p>
    <a href="/admin/login" class="btn-glass primary">{{.Tr.T "sign_in"}}</a>
</div></main></body></html>
{{else}}
{{template "admin/header" .}}

<div class="error-wrapper">
    <div class="error-content">
        <div class="wf-card-static" style="padding: 3rem;">
            <div class="error-icon">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h1>{{.Data.title}}</h1>
            <p>{{.Data.msg}}</p>
            <a href="/admin/" class="btn-glass primary">
                <i class="fas fa-arrow-left"></i> {{.Tr.T "back_to_dashboard"}}
            </a>
        </div>
    </div>
</div>

{{template "admin/footer" .}}
{{end}}
{{end}}
