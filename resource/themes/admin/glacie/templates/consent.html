{{define "admin/consent"}}
<!doctype html><html lang="{{.Tr.Locale}}"><head><title>{{.Tr.T "authorize_app"}}</title>{{template "admin/css"}}</head>
<body><main class="login-wrapper"><div class="login-card wf-card-static" style="padding:2.5rem">
  <h1>{{.Tr.T "authorize_app"}}</h1>
  <p><strong>{{.Data.client}}</strong> {{.Tr.T "requests_access"}} {{.Account.Nickname}}.</p>
  <ul>{{range .Data.scopes}}<li>{{.}}</li>{{end}}</ul>
  <p>{{.Tr.T "consent_warning"}}</p>
  <form method="post" action="/oidc/consent" data-testid="oidc-consent-form">
    <input type="hidden" name="request_id" value="{{.Data.request_id}}">
    <button class="btn-glass primary" type="submit" name="allow" value="yes" data-testid="oidc-consent-allow">{{.Tr.T "allow"}}</button>
    <button class="btn-glass" type="submit" name="allow" value="no" data-testid="oidc-consent-deny">{{.Tr.T "deny"}}</button>
  </form>
</div></main></body></html>
{{end}}
