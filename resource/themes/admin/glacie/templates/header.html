{{define "admin/header"}}
<!DOCTYPE html>
<html lang="{{.Tr.Locale}}">
<head>
    <title>{{.Title}}</title>
    {{template "admin/css"}}
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="pulse-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="glacie-nav">
        <a href="/admin/" class="nav-logo">
            <i class="fas fa-snowflake"></i>
            {{.Conf.Site.SpaceName}}
        </a>

        <button type="button" class="nav-mobile-toggle" aria-label="{{.Tr.T "menu"}}" aria-controls="admin-navigation" aria-expanded="false">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <ul class="nav-links" id="admin-navigation">
            <li><a href="/admin/" class="nav-link{{if eq .Path "/admin/"}} active{{end}}">
                <i class="fas fa-chart-pie"></i> {{.Tr.T "dashboard"}}
            </a></li>
            <li><a href="/admin/publish" class="nav-link{{if eq .Path "/admin/publish"}} active{{end}}">
                <i class="fas fa-pen-nib"></i> {{.Tr.T "publish"}}
            </a></li>
            <li><a href="/admin/articles" class="nav-link{{if eq .Path "/admin/articles"}} active{{end}}">
                <i class="fas fa-newspaper"></i> {{.Tr.T "articles"}}
            </a></li>
            <li><a href="/admin/comments" class="nav-link{{if eq .Path "/admin/comments"}} active{{end}}">
                <i class="fas fa-comments"></i> {{.Tr.T "comments"}}
            </a></li>
            <li><a href="/admin/tags" class="nav-link{{if eq .Path "/admin/tags"}} active{{end}}">
                <i class="fas fa-tags"></i> {{.Tr.T "tags"}}
            </a></li>
            <li><a href="/admin/media" class="nav-link{{if eq .Path "/admin/media"}} active{{end}}">
                <i class="fas fa-photo-film"></i> {{.Tr.T "media"}}
            </a></li>
            <li><a href="/admin/settings" class="nav-link{{if eq .Path "/admin/settings"}} active{{end}}">
                <i class="fas fa-gear"></i> {{.Tr.T "site_settings"}}
            </a></li>
        </ul>

        <div class="nav-user">
            <a href="/" class="btn-glass small" target="_blank" rel="noopener noreferrer" title="{{.Tr.T "view_site"}}">
                <i class="fas fa-external-link-alt"></i>
            </a>
            <span class="nav-user-name">{{.Conf.User.Nickname}}</span>
            <form action="/logout" method="POST" style="margin:0">
                <button type="submit" class="btn-glass small danger" title="{{.Tr.T "logout"}}" aria-label="{{.Tr.T "logout"}}">
                    <i class="fas fa-right-from-bracket"></i>
                </button>
            </form>
        </div>
    </nav>

    <script>
    (function() {
        const toggle = document.querySelector('.nav-mobile-toggle');
        const navigation = document.getElementById('admin-navigation');
        if (!toggle || !navigation) return;

        const closeNavigation = function() {
            navigation.classList.remove('mobile-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.querySelector('i').className = 'fas fa-bars';
        };

        toggle.addEventListener('click', function() {
            const isOpen = navigation.classList.toggle('mobile-open');
            toggle.setAttribute('aria-expanded', String(isOpen));
            toggle.querySelector('i').className = isOpen ? 'fas fa-xmark' : 'fas fa-bars';
        });
        navigation.addEventListener('click', function(event) {
            if (event.target.closest('a')) closeNavigation();
        });
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeNavigation();
                toggle.focus();
            }
        });
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) closeNavigation();
        });
    })();
    </script>

    <main>
{{end}}
