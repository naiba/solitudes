{{define "admin/register"}}
<!doctype html>
<html lang="{{.Tr.Locale}}">
<head><title>{{.Tr.T "create_account"}}</title>{{template "admin/css"}}</head>
<body>
<main class="login-wrapper" id="main-content">
  <div class="login-card wf-card-static" style="padding:2.5rem">
    <h1>{{.Tr.T "create_account"}}</h1><p>{{.Tr.T "verify_email_hint"}}</p>
    <form method="post" action="/admin/register" data-testid="register-form">
      <div class="form-group"><label class="form-label" for="reg-email">{{.Tr.T "email"}}</label>
      <input class="form-input" id="reg-email" name="email" data-testid="register-email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label class="form-label" for="reg-nickname">{{.Tr.T "nickname"}}</label>
      <input class="form-input" id="reg-nickname" name="nickname" data-testid="register-nickname" maxlength="80" autocomplete="nickname" required></div>
      <div class="form-group"><label class="form-label" for="reg-password">{{.Tr.T "password"}}</label>
      <input class="form-input" id="reg-password" name="password" data-testid="register-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
      <div class="form-group"><label class="form-label" for="reg-captcha">{{.Tr.T "captcha"}}</label>
      <div class="captcha-row"><input class="form-input" id="reg-captcha" name="captcha" data-testid="register-captcha" required>
      <img id="reg-captcha-image" class="captcha-img" alt="{{.Tr.T "captcha"}}" onclick="loadCaptcha()" tabindex="0" role="button" onkeydown="if(event.key==='Enter'){loadCaptcha()}"></div></div>
      <input type="hidden" name="captchaId" id="reg-captcha-id">
      <button class="btn-glass primary w-full" type="submit" data-testid="register-submit">{{.Tr.T "create_account"}}</button>
    </form>
    <form method="post" action="/admin/resend-verification" data-testid="resend-form" style="margin-top:1.5rem">
      <div class="form-group"><label class="form-label" for="resend-email">{{.Tr.T "resend_verification"}}</label>
      <input class="form-input" id="resend-email" name="email" data-testid="resend-email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label class="form-label" for="resend-captcha">{{.Tr.T "captcha"}}</label>
      <input class="form-input" id="resend-captcha" name="captcha" data-testid="resend-captcha" required>
      <input type="hidden" name="captchaId" id="resend-captcha-id">
      <img id="resend-captcha-image" class="captcha-img" alt="{{.Tr.T "captcha"}}" onclick="loadResendCaptcha()" tabindex="0" role="button" onkeydown="if(event.key==='Enter'){loadResendCaptcha()}"></div>
      <button class="btn-glass" type="submit" data-testid="resend-submit">{{.Tr.T "resend_verification"}}</button>
    </form>
    <p style="margin-top:1rem"><a href="/admin/login">{{.Tr.T "sign_in"}}</a></p>
  </div>
</main>
<script>function loadCaptcha(){fetch('/captcha').then(r=>r.json()).then(data=>{
document.getElementById('reg-captcha-id').value=data.captchaId;
document.getElementById('reg-captcha-image').src=data.captchaImage;
});}loadCaptcha();</script>
<script>function loadResendCaptcha(){fetch('/captcha').then(r=>r.json()).then(data=>{
document.getElementById('resend-captcha-id').value=data.captchaId;
document.getElementById('resend-captcha-image').src=data.captchaImage;
});}loadResendCaptcha();</script>
</body></html>
{{end}}
