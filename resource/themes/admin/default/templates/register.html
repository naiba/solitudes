{{define "admin/register"}}
<!doctype html>
<html lang="{{.Tr.Locale}}">
<head>{{template "admin/css"}}<title>{{.Tr.T "create_account"}}</title></head>
<body class="bg-gray-50">
<main class="login-container" id="main-content">
  <div class="login-box">
    <h1>{{.Tr.T "create_account"}}</h1>
    <p>{{.Tr.T "verify_email_hint"}}</p>
    <form method="post" action="/admin/register" data-testid="register-form">
      <label class="form-label" for="register-email">{{.Tr.T "email"}}</label>
      <input class="form-control" id="register-email" name="email" data-testid="register-email" type="email" autocomplete="email" required>
      <label class="form-label" for="register-nickname">{{.Tr.T "nickname"}}</label>
      <input class="form-control" id="register-nickname" name="nickname" data-testid="register-nickname" maxlength="80" autocomplete="nickname" required>
      <label class="form-label" for="register-password">{{.Tr.T "password"}}</label>
      <input class="form-control" id="register-password" name="password" data-testid="register-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
      <label class="form-label" for="register-captcha">{{.Tr.T "captcha"}}</label>
      <div class="flex gap-2"><input class="form-control" id="register-captcha" name="captcha" data-testid="register-captcha" required>
        <button type="button" class="admin-button" onclick="loadCaptcha()">{{.Tr.T "refresh_captcha"}}</button></div>
      <input type="hidden" name="captchaId" id="register-captcha-id">
      <img id="register-captcha-image" alt="{{.Tr.T "captcha"}}" onclick="loadCaptcha()" style="cursor:pointer;max-width:100%">
      <button type="submit" data-testid="register-submit" class="admin-button primary w-full mt-4">{{.Tr.T "create_account"}}</button>
    </form>
    <form method="post" action="/admin/resend-verification" data-testid="resend-form" class="mt-4">
      <label class="form-label" for="resend-email">{{.Tr.T "resend_verification"}}</label>
      <input class="form-control" id="resend-email" name="email" data-testid="resend-email" type="email" autocomplete="email" required>
      <label class="form-label" for="resend-captcha">{{.Tr.T "captcha"}}</label>
      <input class="form-control" id="resend-captcha" name="captcha" data-testid="resend-captcha" required>
      <input type="hidden" name="captchaId" id="resend-captcha-id">
      <img id="resend-captcha-image" alt="{{.Tr.T "captcha"}}" onclick="loadResendCaptcha()" style="cursor:pointer;max-width:100%">
      <button type="submit" data-testid="resend-submit" class="admin-button mt-4">{{.Tr.T "resend_verification"}}</button>
    </form>
    <p class="mt-4"><a href="/admin/login">{{.Tr.T "sign_in"}}</a></p>
  </div>
</main>
<script>function loadCaptcha(){fetch('/captcha').then(r=>r.json()).then(data=>{
document.getElementById('register-captcha-id').value=data.captchaId;
document.getElementById('register-captcha-image').src=data.captchaImage;
});}loadCaptcha();</script>
<script>function loadResendCaptcha(){fetch('/captcha').then(r=>r.json()).then(data=>{
document.getElementById('resend-captcha-id').value=data.captchaId;
document.getElementById('resend-captcha-image').src=data.captchaImage;
});}loadResendCaptcha();</script>
</body></html>
{{end}}
