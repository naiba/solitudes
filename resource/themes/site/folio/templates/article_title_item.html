{{define "site/article_title_item"}}
{{range $k, $v := .Items}}
{{$label := tocNumberLabel $.Prefix $k}}
<li class="toc-item toc-level-{{$v.Level}}">
    <a class="toc-link" href="#{{$v.Slug}}">
        <span class="toc-number">{{$label}}</span> <span class="toc-text">{{$v.Title}}</span>
    </a>
    {{if $v.SubTitles}}
    <ol class="toc-child">
        {{template "site/article_title_item" (tocTemplateData $v.SubTitles $label)}}
    </ol>
    {{end}}
</li>
{{end}}
{{end}}
