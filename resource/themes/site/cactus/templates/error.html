{{define "site/error"}}
{{template "site/header" .}}
{{template "site/menu" .}}
<main id="main-content" class="error-page" tabindex="-1">
  <header class="page-heading">
    <h1 class="page-title page-title-error">{{.Data.title}}</h1>
    <p class="page-summary">{{.Data.msg}}</p>
  </header>
  <p class="error-actions"><a href="/"><span aria-hidden="true">←</span> {{.Tr.T "home"}}</a><a href="/posts/">{{.Tr.T "posts"}}</a><a href="/tags/">{{.Tr.T "tags"}}</a></p>
  {{template "site/search_form" .}}
</main>
{{template "site/footer" .}}
{{end}}
