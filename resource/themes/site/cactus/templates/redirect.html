{{define "site/redirect"}}
{{template "site/header" .}}
{{template "site/menu" .}}
<main id="main-content" class="redirect-page" tabindex="-1">
    <header class="page-heading">
        <h1 class="page-title page-title-redirect">{{.Data.title}}</h1>
    </header>
    <div id="redirect-container">
        <p class="page-summary">{{.Data.msg}}</p>
        <p id="target-url"></p>
        <p><a id="continue-link" href="#" rel="noopener noreferrer">{{.Data.continue_text}} <span aria-hidden="true">→</span></a></p>
        <p id="countdown"></p>
    </div>
</main>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var encodedUrl = params.get('url');

        if (!encodedUrl) {
            document.getElementById('redirect-container').innerHTML = '<p>{{.Data.error_no_url}}</p>';
            return;
        }

        try {
            var targetUrl = atob(encodedUrl.replace(/-/g, '+').replace(/_/g, '/'));

            var url = new URL(targetUrl);
            if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                throw new Error('Invalid protocol');
            }

            var targetCode = document.createElement('code');
            targetCode.textContent = targetUrl;
            document.getElementById('target-url').replaceChildren(targetCode);

            var continueLink = document.getElementById('continue-link');
            continueLink.href = targetUrl;

            var countdown = 5;
            var countdownEl = document.getElementById('countdown');
            var updateCountdown = function () {
                countdownEl.textContent = '{{.Data.auto_redirect}} ' + countdown + ' {{.Data.seconds}}';
            };
            updateCountdown();
            var timer = setInterval(function () {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    window.location.href = targetUrl;
                } else {
                    updateCountdown();
                }
            }, 1000);

        } catch (e) {
            document.getElementById('redirect-container').innerHTML = '<p>{{.Data.error_invalid_url}}</p>';
        }
    })();
</script>
{{template "site/footer" .}}
{{end}}
