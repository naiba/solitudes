<style>
@keyframes homepage-pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 var(--accent-alpha, rgba(180, 83, 9, .4));
  }
  50% {
    box-shadow: 0 0 0 6px transparent;
  }
}

.homepage-btn {
  background-image: none !important;
  animation: homepage-pulse 2s ease-in-out infinite;
}

.homepage-btn:hover {
  color: var(--accent-contrast) !important;
  background-color: var(--accent);
  background-image: none !important;
  animation: none;
}
</style>
<script>
(function () {
    function calculateAge(startDate) {
        var birthday = new Date(startDate);
        var ageDifMs = Date.now() - birthday.getTime();
        var ageDate = new Date(ageDifMs);
        return Math.abs(ageDate.getUTCFullYear() - 1970) + 1;
    }

    var working = document.getElementById('yearsSinceWorking');
    var remoteWorking = document.getElementById('yearsSinceRemoteWorking');
    var button = document.querySelector('.homepage-btn');

    if (working) {
        working.textContent = calculateAge('2016-08-01');
    }

    if (remoteWorking) {
        remoteWorking.textContent = calculateAge('2020-08-01');
    }

    if (button) {
        var borderColor = getComputedStyle(button).borderColor;
        var match = borderColor.match(/\d+/g);

        if (match && match.length >= 3) {
            button.style.setProperty(
                '--accent-alpha',
                'rgba(' + match[0] + ',' + match[1] + ',' + match[2] + ',.4)'
            );
        }
    }
})();
</script>
